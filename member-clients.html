<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Clients — WebTeam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0d13;--bg-2:#0d1119;
  --surface:#12161f;--surface-2:#191f2a;--surface-3:#1f2734;
  --border:#252d3b;--border-soft:#1c2330;
  --text:#e9edf5;--text-dim:#8892a6;--text-faint:#5b6478;
  --accent:#7c5cfc;--accent-2:#9d84ff;--accent-soft:#7c5cfc26;
  --mint:#2fe6a6;--mint-soft:#2fe6a624;
  --amber:#ffb454;--amber-soft:#ffb45424;
  --coral:#ff6b6b;--coral-soft:#ff6b6b24;
  --cyan:#3fd0ff;
  --disp:'Space Grotesk',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:20px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text);color-scheme:dark;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit}
button{cursor:pointer;border:0;background:none;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:9px}::-webkit-scrollbar-thumb:hover{background:var(--border)}

/* ---------- shared surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:0 20px 60px #00000066}
.hidden{display:none!important}
.small{font-size:12px;color:var(--text-faint);margin-top:10px;line-height:1.55}

/* ---------- auth / landing ---------- */
.top{position:relative;min-height:100vh;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(circle at 18% 22%,#7c5cfc22,transparent 40%),radial-gradient(circle at 82% 78%,#2fe6a61c,transparent 42%),var(--bg)}
.top::before{content:"";position:absolute;inset:-10%;z-index:0;opacity:.55;
  background-image:radial-gradient(#7c5cfc55 1.4px,transparent 1.6px),radial-gradient(#2fe6a640 1.4px,transparent 1.6px);
  background-size:46px 46px,46px 46px;background-position:0 0,23px 23px;
  animation:driftDots 14s linear infinite;
  mask-image:radial-gradient(ellipse 70% 60% at 50% 40%,#000 60%,transparent 100%)}
.top::after{content:"";position:absolute;width:360px;height:360px;border-radius:50%;filter:blur(80px);opacity:.3;z-index:0;background:var(--accent);top:-110px;right:-110px;animation:floatBlob 10s ease-in-out infinite}
.auth{width:min(430px,100%);padding:32px;position:relative;z-index:1;animation:popIn .45s cubic-bezier(.2,.8,.3,1) both}
.brand{text-align:center;margin-bottom:25px}
.brand h1{margin:0;font-family:var(--disp);font-size:29px;font-weight:700;letter-spacing:-.01em;
  background:linear-gradient(90deg,#7c5cfc,#3fd0ff,#7c5cfc);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 5s linear infinite}
.brand p{color:var(--text-dim);margin:8px 0 0;font-size:13px}
.hero-headline{text-align:center;max-width:520px;margin:0 auto 20px;font-family:var(--disp);font-weight:700;font-size:26px;line-height:1.25;letter-spacing:-.01em;
  background:linear-gradient(90deg,#7c5cfc,#3fd0ff,#7c5cfc);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 5s linear infinite}
@media(max-width:520px){.hero-headline{font-size:20px}.auth{padding:22px}}

.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--bg-2);padding:5px;border-radius:11px;margin-bottom:20px;border:1px solid var(--border-soft)}
.tabs button{padding:11px;border-radius:8px;background:transparent;color:var(--text-dim);font-weight:600;transition:all .2s ease}
.tabs .active{background:var(--surface-3);color:var(--text);box-shadow:0 0 0 1px var(--border) inset}

.field{margin:13px 0}
.field label{display:block;font-size:12px;font-weight:700;margin-bottom:7px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.04em}
.field input,.field select{width:100%;padding:12px 13px;border:1px solid var(--border);border-radius:9px;outline:0;background:var(--bg-2);color:var(--text);transition:border-color .15s ease,box-shadow .15s ease}
.field select option{background:var(--bg-2);color:var(--text)}
.field input::placeholder{color:var(--text-faint)}
.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

.btn{width:100%;padding:13px;border-radius:10px;background:var(--accent);color:#fff;font-weight:700;margin-top:8px;font-size:14px;transition:transform .15s ease,box-shadow .15s ease,filter .15s ease;text-align:center;display:inline-block}
.btn:hover{transform:translateY(-2px);filter:brightness(1.08);box-shadow:0 8px 20px #7c5cfc4d}
.btn.secondary{background:var(--surface-3);color:var(--text);border:1px solid var(--border)}
.btn.secondary:hover{border-color:var(--accent);color:#b9a8ff}
.btn.danger{background:var(--coral-soft);color:var(--coral);border:1px solid #ff6b6b3d}
.btn.danger:hover{box-shadow:0 8px 18px #ff6b6b33}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text-dim)}
.btn.ghost:hover{color:var(--text);border-color:var(--accent)}
.btn.small-btn{width:auto;margin:0;padding:8px 12px;font-size:13px}

/* ---------- app shell ---------- */
.app{min-height:100vh;background:var(--bg)}
.nav{height:64px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:5;animation:fadeIn .4s ease both}
.nav b{font-family:var(--disp);font-size:18px;font-weight:600;letter-spacing:-.01em}
.brand-link{display:flex;align-items:center;gap:8px}
.nav-right{display:flex;gap:10px;align-items:center}
.pill{background:var(--mint-soft);color:var(--mint);border-radius:7px;padding:6px 10px;font-size:11px;font-weight:700;font-family:var(--mono);letter-spacing:.03em;transition:background .2s ease,color .2s ease}
.pill-view{background:var(--amber-soft);color:var(--amber);animation:pulseSoft 2.4s ease-in-out infinite}
.layout{display:grid;grid-template-columns:222px 1fr;min-height:calc(100vh - 64px)}
.side{background:var(--surface);border-right:1px solid var(--border);padding:16px 10px}
.side-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-faint);font-weight:700;padding:8px 12px 6px}
.side a,.side button{display:block;width:100%;text-align:left;background:transparent;padding:11px 12px;border-radius:9px;margin-bottom:3px;color:var(--text-dim);font-weight:600;font-size:14px;border-left:2px solid transparent;transition:background .18s ease,color .18s ease,transform .12s ease}
.side a:hover,.side button:hover{background:var(--surface-2);color:var(--text);transform:translateX(2px)}
.side a.active,.side button.active{background:var(--accent-soft);color:#b9a8ff;border-left:2px solid var(--accent);box-shadow:inset 2px 0 0 var(--accent)}
.main{padding:26px;max-width:1250px;width:100%;margin:auto;animation:fadeInUp .4s ease both}
.main h1{font-family:var(--disp);font-weight:600;letter-spacing:-.01em;margin:0}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:4px}
.page-head p{color:var(--text-dim);margin:6px 0 0;font-size:13.5px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-2);font-weight:700;margin:0 0 6px}

@media(max-width:900px){.layout{grid-template-columns:1fr}.side{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--border)}.side a,.side button{min-width:max-content}.side-label{display:none}.grid{grid-template-columns:1fr 1fr}.two,.three{grid-template-columns:1fr}.main{padding:15px}.nav{padding:0 14px}}
@media(max-width:520px){.grid{grid-template-columns:1fr}}

/* ---------- content blocks ---------- */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{padding:18px;border-left:3px solid var(--border);transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;animation:fadeInUp .45s ease both}
.stat:hover{transform:translateY(-4px);box-shadow:0 14px 30px #00000055;border-color:var(--accent)}
.stat span{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.stat strong{display:block;font-family:var(--mono);font-size:25px;margin-top:8px;font-weight:600;letter-spacing:-.01em}
.grid .stat:nth-child(1){border-left:3px solid var(--accent);animation-delay:.03s}
.grid .stat:nth-child(2){border-left:3px solid var(--cyan);animation-delay:.08s}
.grid .stat:nth-child(3){border-left:3px solid var(--mint);animation-delay:.13s}
.grid .stat:nth-child(4){border-left:3px solid var(--amber);animation-delay:.18s}
.content{margin-top:18px;animation:fadeInUp .4s ease both}
.panel{padding:20px}
.panel h2,.panel h3{margin-top:0;font-family:var(--disp);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}

.ref{position:relative;overflow:hidden;background:linear-gradient(135deg,#241a4a,#0e1a33 60%,#0c2a26);border:1px solid #382a70;color:#fff;padding:22px;border-radius:14px;animation:fadeInUp .45s ease both}
.ref::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent,#ffffff10,transparent);background-size:200% 100%;animation:shimmer 3.2s linear infinite}
.ref h3{font-family:var(--disp);position:relative;z-index:1}
.ref code{display:block;background:#00000040;padding:11px;border-radius:8px;margin:10px 0;overflow:auto;font-family:var(--mono);font-size:12.5px;color:#c9bfff;border:1px solid #ffffff14;position:relative;z-index:1}
.ref button{background:var(--mint);color:#06251b;padding:10px 14px;border-radius:8px;font-weight:700;position:relative;z-index:1}

.empty-state{padding:34px 20px;text-align:center;color:var(--text-faint)}
.empty-state .emoji{font-size:34px;display:block;margin-bottom:8px;opacity:.8}

.table-wrap{overflow:auto}
.table{width:100%;border-collapse:collapse}
.table th,.table td{text-align:left;padding:11px;border-bottom:1px solid var(--border-soft);font-size:13px;white-space:nowrap}
.table th{color:var(--text-faint);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.table td{color:var(--text)}
.table tbody tr{transition:background .15s ease}
.table tbody tr:hover{background:var(--surface-2)}
.badge{display:inline-block;padding:5px 9px;border-radius:6px;font-size:10.5px;font-weight:700;background:var(--surface-3);color:var(--text-dim);font-family:var(--mono);text-transform:uppercase;letter-spacing:.03em;transition:transform .15s ease}
.badge.green{background:var(--mint-soft);color:var(--mint)}
.badge.orange{background:var(--amber-soft);color:var(--amber)}
.badge.red{background:var(--coral-soft);color:var(--coral)}

.chat{height:calc(100vh - 300px);min-height:420px;display:flex;flex-direction:column}
.messages{flex:1;overflow:auto;background:var(--bg-2);border-radius:12px;padding:15px;border:1px solid var(--border-soft)}
.msg{max-width:82%;padding:10px 12px;border-radius:11px;margin:7px 0;font-size:13px;line-height:1.5;animation:popIn .22s ease both}
.bot{background:var(--surface-2);border:1px solid var(--border);color:var(--text)}
.me{background:var(--accent);color:#fff;margin-left:auto}
.chatbar{display:flex;gap:8px;margin-top:10px}
.chatbar input{flex:1;padding:12px;border:1px solid var(--border);border-radius:9px;background:var(--bg-2);color:var(--text)}
.chatbar button{padding:0 18px;border-radius:9px;background:var(--accent);color:#fff;font-weight:700}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.chip{background:var(--surface-3);border:1px solid var(--border);color:var(--text-dim);padding:7px 12px;border-radius:999px;font-size:12px;font-weight:600;transition:all .15s ease}
.chip:hover{color:var(--text);border-color:var(--accent)}

.modal{position:fixed;inset:0;background:#000000a6;display:flex;align-items:center;justify-content:center;padding:20px;z-index:20;animation:fadeIn .2s ease both}
.modal .card{width:min(500px,100%);padding:24px;animation:popIn .28s cubic-bezier(.2,.8,.3,1) both}
.toast{position:fixed;right:18px;bottom:18px;background:var(--surface-3);border:1px solid var(--border);color:var(--text);padding:12px 15px;border-radius:10px;display:none;z-index:30;font-size:13px;animation:popIn .22s ease both}

.demo-ticker{position:relative;height:34px;overflow:hidden;background:var(--surface-2);border-bottom:1px solid var(--border);display:flex;align-items:center}
.demo-ticker-text{width:100%;text-align:center;font-family:var(--mono);font-size:12.5px;color:var(--mint);letter-spacing:.02em;animation:fadeIn .4s ease}
.demo-dot{position:absolute;top:8px;right:12px;width:9px;height:9px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 3px var(--mint-soft);cursor:default}
.demo-dot:hover::after{content:"Demo";position:absolute;top:16px;right:-2px;background:var(--surface-3);color:var(--text);border:1px solid var(--border);padding:4px 8px;border-radius:6px;font-size:10.5px;font-weight:700;white-space:nowrap;font-family:var(--mono)}

.video-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.video-card{background:var(--surface-2);border:1px solid var(--border);border-radius:13px;overflow:hidden;transition:transform .2s ease,box-shadow .2s ease}
.video-card:hover{transform:translateY(-3px);box-shadow:0 12px 26px #00000055}
.video-embed{position:relative;width:100%;padding-top:56.25%;background:#000}
.video-embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.video-info{padding:12px 14px}
.video-info h4{margin:0 0 6px;font-family:var(--disp);font-size:15px}

.notif-wrap{position:relative}
.icon-btn{position:relative;background:var(--surface-3);color:var(--text);width:38px;height:38px;border-radius:10px;font-size:17px;display:flex;align-items:center;justify-content:center;transition:transform .15s ease,background .15s ease;border:1px solid var(--border)}
.icon-btn:hover{transform:translateY(-2px) rotate(-6deg);border-color:var(--accent)}
.notif-badge{position:absolute;top:-4px;right:-4px;background:var(--coral);color:#fff;font-size:10px;font-weight:800;min-width:18px;height:18px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 4px;animation:pulseSoft 1.6s ease-in-out infinite;box-shadow:0 2px 6px #ff6b6b55}
.notif-panel{position:absolute;top:50px;right:0;width:300px;max-height:380px;overflow:auto;background:var(--surface-2);border:1px solid var(--border);border-radius:13px;box-shadow:0 16px 40px #00000066;padding:8px;z-index:40;animation:popIn .2s ease both}
.notif-item{padding:10px 12px;border-radius:9px;font-size:13px;border-bottom:1px solid var(--border-soft);transition:background .15s ease;color:var(--text)}
.notif-item:last-child{border-bottom:0}
.notif-item:hover{background:var(--surface-3)}
.notif-time{font-size:11px;color:var(--text-faint);margin-top:3px;font-family:var(--mono)}
.notif-empty{padding:16px;text-align:center;color:var(--text-faint);font-size:13px}

.name-row{display:flex;align-items:center;gap:9px;cursor:pointer}
.avatar{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:800;flex-shrink:0}
.link-name{color:var(--text);font-weight:600;transition:color .15s ease}
.name-row:hover .link-name{color:#b9a8ff;text-decoration:underline}

.welcome-modal{z-index:80;animation:fadeIn .25s ease both}
.welcome-card{position:relative;overflow:hidden;padding:36px 30px;text-align:center;background:linear-gradient(160deg,var(--surface),var(--bg-2));border:1px solid var(--border)}
.confetti-wrap{position:absolute;inset:0;pointer-events:none}
.confetti{position:absolute;top:-20px;width:8px;height:14px;opacity:.95;border-radius:2px;animation:confettiFall 2.8s ease-in forwards}
.welcome-emoji{font-size:56px;animation:popIn .5s cubic-bezier(.2,.8,.3,1) both}
.welcome-card h2{font-family:var(--disp);background:linear-gradient(90deg,#7c5cfc,#3fd0ff);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:25px;margin:10px 0 6px}
.welcome-card ul{list-style:none;padding:0;margin:0 0 6px}
.welcome-card li{padding:8px 10px;border-radius:9px;background:var(--surface-3);margin-bottom:6px;font-size:13px;text-align:left;color:var(--text)}

.money-rain{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.money-rain .coin{position:absolute;top:-40px;animation-name:coinFall;animation-timing-function:cubic-bezier(.4,.2,.6,1);animation-fill-mode:forwards;filter:drop-shadow(0 2px 4px #00000055)}

/* ---------- footer ---------- */
.site-footer{text-align:center;padding:22px 14px 30px;color:var(--text-faint);font-size:12px}

/* ---------- keyframes ---------- */
@keyframes fadeInUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes floatBlob{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(20px,-25px) scale(1.08)}}
@keyframes popIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@keyframes shimmer{0%{background-position:0% 50%}100%{background-position:200% 50%}}
@keyframes pulseSoft{0%,100%{box-shadow:0 0 0 0 #7c5cfc4a}50%{box-shadow:0 0 0 8px #7c5cfc00}}
@keyframes driftDots{0%{background-position:0 0,0 0}100%{background-position:120px 80px,-80px 60px}}
@keyframes coinFall{0%{transform:translateY(-40px) rotate(0deg);opacity:1}80%{opacity:1}100%{transform:translateY(105vh) rotate(360deg);opacity:0}}
@keyframes confettiFall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(440px) rotate(560deg);opacity:0}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}

</style>
</head>
<body>
<div class="app">
  <div id="navRoot"></div>
  <div class="layout">
    <aside id="sideRoot" class="side"></aside>
    <main id="mainContent" class="main"></main>
  </div>
</div>

<div id="modal" class="modal hidden"><div class="card" id="modalBody"></div></div>
<div id="toast" class="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyD1OYFiUxgHPsdNcy7UwJn-sNMA-EnMnCA",
    authDomain: "absa-developers.firebaseapp.com",
    projectId: "absa-developers",
    storageBucket: "absa-developers.firebasestorage.app",
    messagingSenderId: "559575822664",
    appId: "1:559575822664:web:8b845785b2a0eed00437d"
  };
  firebase.initializeApp(firebaseConfig);
</script>
<script>
/* ==========================================================================
   WebTeam Manager — shared core
   Loaded by every page. Data lives in localStorage so all pages share it.
   ========================================================================== */

const ADMIN_CODE = "Rana9053$"; // DEMO ONLY. Never check a real admin secret client-side.
const VIEWER_CODE = "1947";     // read-only admin, no editing, no bot
const KEY = "webteam_demo_v2";

const state = JSON.parse(localStorage.getItem(KEY) || '{"members":[],"clients":[],"payments":[],"commissions":[],"videos":[]}');
if (!state.videos) state.videos = [];

let current = null, role = null;

/* ---------------- Firebase (online, cross-device sync) ---------------- */
const db = firebase.firestore();
const dataDocRef = db.collection("webteam").doc("data");
let dataReady = false;
const readyCallbacks = [];
function whenDataReady(cb) { if (dataReady) cb(); else readyCallbacks.push(cb); }
dataDocRef.onSnapshot(function (doc) {
  const d = doc.data() || {};
  state.members = d.members || [];
  state.clients = d.clients || [];
  state.payments = d.payments || [];
  state.commissions = d.commissions || [];
  state.videos = d.videos || [];
  localStorage.setItem(KEY, JSON.stringify(state));
  dataReady = true;
  readyCallbacks.forEach(function (cb) { cb(); });
}, function (err) {
  console.error("Firestore sync error:", err);
  toast("Connection issue — data offline, check internet");
});

function save() {
  localStorage.setItem(KEY, JSON.stringify(state));
  return dataDocRef.set(state).catch(function (err) {
    console.error("Firestore save error:", err);
    toast("Save failed — check internet connection");
  });
}
function id(prefix) { return prefix + "-" + Math.random().toString(36).slice(2, 8).toUpperCase(); }
function money(n) { return "Rs. " + Number(n || 0).toLocaleString("en-PK"); }
function esc(s) { return String(s || "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m])); }
function toast(t) { const x = document.getElementById("toast"); if (!x) return; x.textContent = t; x.style.display = "block"; setTimeout(() => x.style.display = "none", 2200); }

function playMoneyRain() {
  const layer = document.createElement("div"); layer.className = "money-rain"; document.body.appendChild(layer);
  const symbols = ["💰", "💵", "🪙", "₨"];
  for (let i = 0; i < 20; i++) {
    const s = document.createElement("span"); s.className = "coin"; s.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    s.style.left = Math.random() * 100 + "vw"; s.style.animationDuration = (1.5 + Math.random() * 1.3) + "s"; s.style.animationDelay = (Math.random() * .5) + "s"; s.style.fontSize = (18 + Math.random() * 20) + "px";
    layer.appendChild(s);
  }
  setTimeout(() => layer.remove(), 3200);
}

/* ---------------- session ---------------- */
function saveSession() { if (role === "member") localStorage.setItem("webteam_session", JSON.stringify({ role, id: current.id })); else if (role === "admin" || role === "viewer") localStorage.setItem("webteam_session", JSON.stringify({ role })); }
function clearSession() { localStorage.removeItem("webteam_session"); }
function restoreSession() {
  try {
    const s = JSON.parse(localStorage.getItem("webteam_session") || "null");
    if (!s) return false;
    if (s.role === "member") {
      const m = state.members.find(x => x.id === s.id);
      if (m) { current = m; role = "member"; return true; }
      return false;
    } else if (s.role === "admin") { role = "admin"; current = { name: "Administrator" }; return true; }
    else if (s.role === "viewer") { role = "viewer"; current = { name: "Viewer" }; return true; }
  } catch (e) { }
  return false;
}
function logout() { clearSession(); location.href = "index.html"; }
function guardMember() { if (!restoreSession() || role !== "member") { location.href = "index.html"; return false; } return true; }
function guardAdmin() { if (!restoreSession() || (role !== "admin" && role !== "viewer")) { location.href = "index.html"; return false; } return true; }
function redirectIfLoggedIn() {
  if (!restoreSession()) return;
  if (role === "member") location.href = "member-dashboard.html";
  else location.href = "admin-dashboard.html";
}

/* ---------------- avatars & notifications ---------------- */
const AVATAR_COLORS = ["#3157d5", "#6b4ee8", "#21c37a", "#ff8a3d", "#ff5c7c", "#00b4d8", "#a86600"];
function avatarColor(str) { let h = 0; for (let i = 0; i < str.length; i++) h = str.charCodeAt(i) + ((h << 5) - h); return AVATAR_COLORS[Math.abs(h) % AVATAR_COLORS.length]; }
function computeNotifications() {
  const events = [];
  state.members.forEach(m => events.push({ time: m.created, text: `👤 Naya member aya: <b>${esc(m.name)}</b>` }));
  state.clients.forEach(c => events.push({ time: c.created, text: `🧾 Naya client aya: <b>${esc(c.name)}</b>` }));
  events.sort((a, b) => new Date(b.time) - new Date(a.time));
  return events.slice(0, 25);
}
function unreadCount() { const readAt = localStorage.getItem("webteam_notif_read") || "1970-01-01"; return computeNotifications().filter(e => new Date(e.time) > new Date(readAt)).length; }
function renderNotifBadge() { const badge = document.getElementById("notifBadge"); if (!badge) return; const c = unreadCount(); if (c > 0) { badge.textContent = c > 9 ? "9+" : c; badge.classList.remove("hidden"); } else badge.classList.add("hidden"); }
function toggleNotifPanel() {
  const panel = document.getElementById("notifPanel"); if (!panel) return;
  const willOpen = panel.classList.contains("hidden");
  document.querySelectorAll(".notif-panel").forEach(p => p.classList.add("hidden"));
  if (willOpen) {
    panel.classList.remove("hidden");
    const events = computeNotifications();
    panel.innerHTML = events.length ? events.map(e => `<div class="notif-item">${e.text}<div class="notif-time">${new Date(e.time).toLocaleString()}</div></div>`).join("") : `<div class="notif-empty">Koi notification nahi 🙂</div>`;
    localStorage.setItem("webteam_notif_read", new Date().toISOString());
    renderNotifBadge();
  }
}
document.addEventListener("click", function (e) { const wrap = document.querySelector(".notif-wrap"); if (wrap && !wrap.contains(e.target)) document.getElementById("notifPanel")?.classList.add("hidden"); });

function showLoginPopup() {
  const readAt = localStorage.getItem("webteam_notif_read") || "1970-01-01";
  const newMembers = state.members.filter(m => new Date(m.created) > new Date(readAt));
  const newClients = state.clients.filter(c => new Date(c.created) > new Date(readAt));
  if (!newMembers.length && !newClients.length) { renderNotifBadge(); return; }
  const ov = document.createElement("div"); ov.className = "modal welcome-modal";
  const colors = ["#3157d5", "#6b4ee8", "#21c37a", "#ffb020", "#ff5c7c", "#00b4d8"];
  ov.innerHTML = `<div class="card welcome-card"><div class="confetti-wrap">${Array.from({ length: 14 }).map(() => `<span class="confetti" style="left:${Math.random() * 100}%;background:${colors[Math.floor(Math.random() * colors.length)]};animation-delay:${(Math.random() * .6).toFixed(2)}s"></span>`).join("")}</div><div style="position:relative;z-index:1"><div class="welcome-emoji">🔔</div><h2>Naya Update!</h2>${newMembers.length ? `<p style="text-align:left;font-weight:700;margin-bottom:6px">👤 Naye Members (${newMembers.length}):</p><ul>${newMembers.map(m => `<li>${esc(m.name)} — ${esc(m.phone)}</li>`).join("")}</ul>` : ""}${newClients.length ? `<p style="text-align:left;font-weight:700;margin-bottom:6px">🧾 Naye Clients (${newClients.length}):</p><ul>${newClients.map(c => `<li>${esc(c.name)} — ${money(c.amount)}</li>`).join("")}</ul>` : ""}<button class="btn" onclick="this.closest('.welcome-modal').remove()">Dekh Liya ✅</button></div></div>`;
  document.body.appendChild(ov);
  localStorage.setItem("webteam_notif_read", new Date().toISOString());

}

function referralCode(name) { return name.replace(/[^a-zA-Z]/g, "").slice(0, 3).toUpperCase() + Math.floor(100 + Math.random() * 900); }
function registerMember() {
  const name = regName.value.trim(), email = regEmail.value.trim().toLowerCase(), phone = regPhone.value.trim(), pass = regPass.value, ref = regRef.value.trim().toUpperCase();
  if (!name || !email || !phone || !pass) return toast("Please fill all required fields");
  if (state.members.some(m => m.email === email || m.phone === phone)) return toast("Account already exists");
  let referrer = state.members.find(m => m.code === ref);
  const m = { id: id("MEM"), name, email, phone, pass, code: referralCode(name), referredBy: referrer ? referrer.id : null, created: new Date().toISOString() };
  state.members.push(m); save(); current = m; role = "member"; saveSession();
  localStorage.setItem("webteam_just_registered", name);
  location.href = "member-dashboard.html";
}
function loginMember() {
  const v = loginId.value.trim().toLowerCase(), p = loginPass.value;
  const m = state.members.find(x => (x.email === v || x.phone === v) && x.pass === p);
  if (!m) return toast("Invalid login details");
  current = m; role = "member"; saveSession();
  location.href = "member-dashboard.html";
}
function loginAdmin() {
  const v = adminCode.value;
  if (v === ADMIN_CODE) { role = "admin"; current = { name: "Administrator" }; saveSession(); location.href = "admin-dashboard.html"; }
  else if (v === VIEWER_CODE) { role = "viewer"; current = { name: "Viewer" }; saveSession(); location.href = "admin-dashboard.html"; }
  else return toast("Invalid admin code");
}

let demoTickerTimer = null;
function maskedPhone() { const p = "03" + Math.floor(100000000 + Math.random() * 899999999).toString(); return p.slice(0, 2) + "*****" + p.slice(-1); }

function startDemoTicker() {
  const el = document.getElementById("demoTickerText"); if (!el) return;

  const tick = () => { el.style.animation = "none"; void el.offsetWidth; el.style.animation = ""; el.textContent = demoTickerLine(); };

}

/* ---------------- modals: clients ---------------- */
function openClientModal(admin = false) {
  modal.classList.remove("hidden");
  modalBody.innerHTML = `<h2>Add Client</h2><div class="field"><label>Client Name</label><input id="cmName"></div><div class="field"><label>WhatsApp / Phone</label><input id="cmPhone"></div><div class="field"><label>Business</label><input id="cmBusiness" placeholder="Restaurant, Academy, Gym..."></div><div class="field"><label>Deal Amount</label><input id="cmAmount" type="number" value="0"></div><div class="field"><label>Status</label><select id="cmStatus"><option>NEW</option><option>CONTACTED</option><option>INTERESTED</option><option>DEAL_CONFIRMED</option><option>PAYMENT_RECEIVED</option><option>COMPLETED</option><option>CANCELLED</option></select></div><button class="btn" onclick="addClient(${admin})">Save Client</button><button class="btn secondary" onclick="closeModal()">Cancel</button>`;
}
function addClient(admin) {
  if (admin && role !== "admin") return toast("View-only mode: aap client add nahi kar saktay");
  const n = cmName.value.trim(), ph = cmPhone.value.trim(), amount = Number(cmAmount.value || 0);
  if (!n || !ph) return toast("Name and phone are required");
  if (state.clients.some(c => c.phone === ph)) return toast("This client already exists");
  const c = { id: id("CLI"), name: n, phone: ph, business: cmBusiness.value, status: cmStatus.value, amount, addedBy: admin ? null : current.id, created: new Date().toISOString() };
  state.clients.push(c); save(); closeModal();
  toast("Client added");
  setTimeout(() => { location.href = admin ? "admin-clients.html" : "member-clients.html"; }, 350);
}
function editClientModal(cid) {
  const c = state.clients.find(x => x.id === cid); if (!c) return;
  modal.classList.remove("hidden");
  modalBody.innerHTML = `<h2>Edit Client</h2><div class="field"><label>Client Name</label><input id="ecName" value="${esc(c.name)}"></div><div class="field"><label>WhatsApp / Phone</label><input id="ecPhone" value="${esc(c.phone)}"></div><div class="field"><label>Business</label><input id="ecBusiness" value="${esc(c.business || "")}"></div><div class="field"><label>Deal Amount</label><input id="ecAmount" type="number" value="${c.amount || 0}"></div><div class="field"><label>Status</label><select id="ecStatus">${["NEW", "CONTACTED", "INTERESTED", "DEAL_CONFIRMED", "PAYMENT_RECEIVED", "COMPLETED", "CANCELLED"].map(s => `<option ${s === c.status ? "selected" : ""}>${s}</option>`).join("")}</select></div><button class="btn" onclick="saveClientEdit('${c.id}')">Save Changes</button><button class="btn secondary" onclick="closeModal()">Cancel</button>`;
}
function saveClientEdit(cid) {
  if (role !== "admin") return toast("View-only mode: aap edit nahi kar saktay");
  const c = state.clients.find(x => x.id === cid); if (!c) return;
  c.name = ecName.value.trim() || c.name; c.phone = ecPhone.value.trim() || c.phone; c.business = ecBusiness.value.trim(); c.amount = Number(ecAmount.value || 0); c.status = ecStatus.value;

/* ---------------- modals: payments ---------------- */
function openPaymentModal() {
  if (!state.clients.length) {
    modal.classList.remove("hidden");
    modalBody.innerHTML = `<h2>Record Payment</h2><p class="small">Abhi tak koi client add nahi hua. Payment record karne se pehle ek client add karein.</p><button class="btn" onclick="closeModal();openClientModal(true)">+ Add Client</button><button class="btn secondary" onclick="closeModal()">Cancel</button>`;
    return;
  }
  modal.classList.remove("hidden");
  modalBody.innerHTML = `<h2>Record Payment</h2><div class="field"><label>Client</label><select id="payClient">${state.clients.map(c => `<option value="${c.id}">${esc(c.name)} — ${money(c.amount)}</option>`).join("")}</select></div><div class="field"><label>Payment Amount</label><input id="payAmount" type="number"></div><button class="btn" onclick="recordPayment()">Record & Generate Commission</button><button class="btn secondary" onclick="closeModal()">Cancel</button>`;
}
function recordPayment() {
  if (role !== "admin") return toast("View-only mode: aap payment record nahi kar saktay");
  const c = state.clients.find(x => x.id === payClient.value), amount = Number(payAmount.value || 0);
  if (!c || amount <= 0) return toast("Enter a valid payment");
  state.payments.push({ id: id("PAY"), clientId: c.id, clientName: c.name, amount, date: new Date().toISOString() });
  c.status = "PAYMENT_RECEIVED"; c.amount = amount;
  if (c.addedBy) {
    let seller = state.members.find(m => m.id === c.addedBy);
    state.commissions.push({ id: id("COM"), memberId: seller.id, clientName: c.name, type: "direct", amount: amount * .10, status: "PENDING" });
    if (seller.referredBy) { let ref = state.members.find(m => m.id === seller.referredBy); if (ref) state.commissions.push({ id: id("COM"), memberId: ref.id, clientName: c.name, type: "referral", amount: amount * .05, status: "PENDING" }); }
  }
  save(); closeModal(); toast("Payment recorded and commission generated"); playMoneyRain();
  setTimeout(() => { location.href = "admin-payments.html"; }, 350);
}
function markPaid(cid) {
  if (role !== "admin") return toast("View-only mode: aap edit nahi kar saktay");
  let c = state.commissions.find(x => x.id === cid);
  if (c) { c.status = "PAID"; c.paidAt = new Date().toISOString(); save(); toast("Commission marked paid"); playMoneyRain(); setTimeout(() => location.reload(), 350); }
}
function closeModal() { modal.classList.add("hidden"); }

/* ---------------- videos ---------------- */
function extractYoutubeId(url) {
  if (!url) return null;
  const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([a-zA-Z0-9_-]{6,})/);
